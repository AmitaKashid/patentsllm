name: PatentLLM CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Run tests and smoke checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest

      - name: Run tests
        run: |
          pytest -q

      - name: Check documentation artifacts
        run: |
          test -f docs/architecture/pipeline_design.md
          test -f docs/results/final_claim_bank_grounded_report.md
          test -f docs/results/claim_bank_alignment_summary.md